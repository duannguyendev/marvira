<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Marvira app icon">
  <!--
    FINAL MASTER - light indigo bg, Option 27 letters.
    scale 1.2, stroke 64
    M no right vertical; i stem to cutout; i-dot cy=63 r=32 with mask halo r=40
    M purple | A pink | V orange | i yellow | r brown
  -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="letterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <mask id="idotCutout" maskUnits="userSpaceOnUse" x="-80" y="-80" width="560" height="560">
      <rect x="-80" y="-80" width="560" height="560" fill="white"/>
      <circle cx="340" cy="63" r="40" fill="black"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g id="mark" transform="translate(512 512) scale(1.2) translate(-512 -512)">
    <g transform="translate(312 312)">
      <g
        id="letters"
        fill="none"
        stroke-width="64"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="1"
        filter="url(#letterShadow)"
        mask="url(#idotCutout)">

        <g id="letter-M" stroke="#E879F9">
          <path d="M60 340 L60 60 L200 240 L340 60"/>
        </g>

        <g id="letter-A" stroke="#EC4899">
          <path d="M60 340 L60 60"/>
          <path d="M60 60 L200 240"/>
          <path d="M60 193 C140 147 250 147 340 193"/>
        </g>

        <g id="letter-V" stroke="#F97316">
          <path d="M60 60 L200 240 L340 60"/>
        </g>

        <g id="letter-r" stroke="#9A3412">
          <path d="M60 340 L60 153"/>
          <path d="M60 193 C140 147 250 147 340 193"/>
        </g>

        <g id="letter-i" stroke="#FACC15">
          <path d="M340 63 L340 340"/>
        </g>
      </g>

      <circle cx="340" cy="63" r="32" fill="#FACC15" stroke="none"/>
    </g>
  </g>
</svg>
