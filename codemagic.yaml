# Codemagic CI for Marvira mobile (React Native)
#
# Setup:
# 1. Connect this repo in Codemagic
# 2. Create env group `marvira_mobile_secrets` with Secure vars from
#    marvira_mobile/.env.example (GOOGLE_MAPS_API_KEY, API_BASE_URL, MARKETING_SITE_URL)
# 3. Optional: GOOGLE_SERVICES_JSON_BASE64, GOOGLE_SERVICE_INFO_PLIST_BASE64
# 4. Configure iOS code signing + Android keystore in Codemagic UI
#
# No manual secrets script — Start Build is enough.
# Local: copy .env.example → .env.local, then yarn android / yarn ios (or Run in IDE).

workflows:
  android-release:
    name: Android Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    working_directory: marvira_mobile
    environment:
      groups:
        - marvira_mobile_secrets
      vars:
        PACKAGE_NAME: com.marvira
      node: 22
      java: 17
      android_signing:
        - marvira_android
    scripts:
      - name: Verify required ENV
        script: |
          test -n "$GOOGLE_MAPS_API_KEY"
          test -n "$API_BASE_URL"
          test -n "$MARKETING_SITE_URL"
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Write Firebase config (optional)
        script: |
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi
      - name: Build Android App Bundle
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - hello@marvira.example.com
        notify:
          success: true
          failure: true

  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: marvira_mobile
    integrations:
      app_store_connect: marvira_asc
    environment:
      groups:
        - marvira_mobile_secrets
      vars:
        XCODE_WORKSPACE: ios/Marvira.xcworkspace
        XCODE_SCHEME: Marvira
        BUNDLE_ID: com.marvira
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.marvira
    scripts:
      - name: Verify required ENV
        script: |
          test -n "$GOOGLE_MAPS_API_KEY"
          test -n "$API_BASE_URL"
          test -n "$MARKETING_SITE_URL"
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Write Firebase config (optional)
        script: |
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Marvira/GoogleService-Info.plist
            cp ios/Marvira/GoogleService-Info.plist ios/GoogleService-Info.plist
          fi
      - name: CocoaPods
        script: |
          cd ios
          pod install
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - hello@marvira.example.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
