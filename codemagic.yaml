# Codemagic CI for Marvira mobile (React Native)
#
# Setup checklist (Codemagic UI):
# 1. Connect this repo → Applications → check for this yaml
# 2. Env group `marvira_mobile_secrets` (Secure) with:
#      GOOGLE_MAPS_API_KEY
#      API_BASE_URL              (e.g. https://api.marvira.com or Railway URL)
#      MARKETING_SITE_URL        (e.g. https://www.marvira.com)
#      GOOGLE_WEB_CLIENT_ID      (Web OAuth client — Google Sign-In)
#      FACEBOOK_APP_ID
#      FACEBOOK_CLIENT_TOKEN
#      GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS  (full Play API JSON key contents)
# 3. Optional override (repo already has placeholder Firebase configs):
#      GOOGLE_SERVICES_JSON_BASE64
#      GOOGLE_SERVICE_INFO_PLIST_BASE64
# 4. Code signing identities:
#      Android keystore reference name: marvira_android
#      iOS: App Store Connect integration name: marvira_asc
# 5. Play Console: create app com.marvira, invite the service account (Releases),
#    then upload the FIRST AAB manually once. Later android-release builds auto-publish.
# 6. Start Build → android-release (→ Play internal) or ios-release (→ TestFlight)
#
# Override Play track without editing yaml: set GOOGLE_PLAY_TRACK=production (etc.)
#
# Local: copy marvira_mobile/.env.example → .env.local, then yarn android / yarn ios.
# See marvira_mobile/CODEMAGIC.md

workflows:
  android-release:
    name: Android Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    working_directory: marvira_mobile
    environment:
      groups:
        - marvira_mobile_secrets
      vars:
        PACKAGE_NAME: com.marvira
      node: 22
      java: 17
      android_signing:
        - marvira_android
    scripts:
      - name: Verify required ENV
        script: |
          set -e
          for v in \
            GOOGLE_MAPS_API_KEY \
            API_BASE_URL \
            MARKETING_SITE_URL \
            GOOGLE_WEB_CLIENT_ID \
            FACEBOOK_APP_ID \
            FACEBOOK_CLIENT_TOKEN \
            GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
          do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then
              echo "Missing required Secure ENV: $v (group marvira_mobile_secrets)"
              exit 1
            fi
          done
          echo "Required ENV present."
      - name: Install yarn dependencies
        script: |
          yarn install --frozen-lockfile
      - name: Write Firebase config (optional)
        script: |
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "Wrote android/app/google-services.json from ENV"
          else
            echo "Using committed google-services.json"
          fi
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build Android App Bundle
        script: |
          # Signed via CM_* env from android_signing (see app/build.gradle)
          test -n "$CM_KEYSTORE_PATH"
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - support@marvira.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        # Default: internal testing. Override at build time with GOOGLE_PLAY_TRACK.
        track: internal
        submit_as_draft: false

  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: marvira_mobile
    integrations:
      app_store_connect: marvira_asc
    environment:
      groups:
        - marvira_mobile_secrets
      vars:
        XCODE_WORKSPACE: ios/Marvira.xcworkspace
        XCODE_SCHEME: Marvira
        BUNDLE_ID: com.marvira
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.marvira
    scripts:
      - name: Verify required ENV
        script: |
          set -e
          for v in \
            GOOGLE_MAPS_API_KEY \
            API_BASE_URL \
            MARKETING_SITE_URL \
            GOOGLE_WEB_CLIENT_ID \
            FACEBOOK_APP_ID \
            FACEBOOK_CLIENT_TOKEN
          do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then
              echo "Missing required Secure ENV: $v (group marvira_mobile_secrets)"
              exit 1
            fi
          done
          echo "Required ENV present."
      - name: Install yarn dependencies
        script: |
          yarn install --frozen-lockfile
      - name: Write Firebase config (optional)
        script: |
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Marvira/GoogleService-Info.plist
            cp ios/Marvira/GoogleService-Info.plist ios/GoogleService-Info.plist
            echo "Wrote GoogleService-Info.plist from ENV"
          else
            echo "Using committed GoogleService-Info.plist"
          fi
      - name: CocoaPods
        script: |
          cd ios
          pod install
      - name: Set iOS build number
        script: |
          cd ios
          agvtool new-version -all "$((BUILD_NUMBER))"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - support@marvira.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
