services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: marvira
      POSTGRES_PASSWORD: marvira
      POSTGRES_DB: marvira
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marvira']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://marvira:marvira@postgres:5432/marvira?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_DISABLED: "false"
      JWT_SECRET: ${JWT_SECRET:-replace-with-32-char-minimum-secret-for-docker}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace-with-32-char-minimum-refresh-secret}
      OAUTH_DEV_BYPASS: "false"
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000,http://localhost:3002
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_uploads:/app/uploads

  dashboard:
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api

  marketing:
    build:
      context: ..
      dockerfile: docker/marketing.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_SITE_URL: http://localhost:3002
        NEXT_PUBLIC_CDN_URL: ''
        NEXT_PUBLIC_APP_STORE_URL: ''
        NEXT_PUBLIC_PLAY_STORE_URL: ''
    ports:
      - '3002:3002'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SITE_URL: http://localhost:3002
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  api_uploads:
