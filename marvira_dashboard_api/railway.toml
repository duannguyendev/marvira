# Railway API — Root Directory: marvira_dashboard_api

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/api.Dockerfile"

[deploy]
# Disable healthcheck until the process stays up. CLEAR this in Railway UI too:
# Settings → Deploy → Healthcheck Path → delete / leave empty.
# After Deploy Logs show "API running on http://0.0.0.0:...", set back to "/health".
restartPolicyType = "ON_FAILURE"
preDeployCommand = ["prisma migrate deploy --schema=./prisma/schema.prisma"]
