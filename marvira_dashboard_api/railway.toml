# Railway API — Root Directory: marvira_dashboard_api
# Config path in UI if needed: /marvira_dashboard_api/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/api.Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
preDeployCommand = ["prisma migrate deploy --schema=./prisma/schema.prisma"]
