# Railway API service — set service Root Directory to `marvira_dashboard_api`
# (repo root has no package.json; Railpack fails without that root).
# Config file path in Railway UI (if asked): /marvira_dashboard_api/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/api.Dockerfile"

[deploy]
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
