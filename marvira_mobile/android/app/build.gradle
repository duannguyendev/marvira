apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def loadDotEnvLocal = {
    def props = new Properties()
    def envFile = rootProject.file('../.env.local')
    if (!envFile.exists()) {
        envFile = rootProject.file('../.env')
    }
    if (envFile.exists()) {
        envFile.eachLine { raw ->
            def line = raw.trim()
            if (!line || line.startsWith('#')) {
                return
            }
            def idx = line.indexOf('=')
            if (idx > 0) {
                def key = line.substring(0, idx).trim()
                def value = line.substring(idx + 1).trim()
                if ((value.startsWith('"') && value.endsWith('"')) ||
                    (value.startsWith("'") && value.endsWith("'"))) {
                    value = value.substring(1, value.length() - 1)
                }
                props.setProperty(key, value)
            }
        }
    }
    return props
}

def envLocal = loadDotEnvLocal()
def PLACEHOLDER_MAPS_KEY = 'YOUR_GOOGLE_MAPS_API_KEY'

/**
 * Codemagic / shell ENV wins, then local `.env.local`.
 * Build fails if the key is missing (debug and release).
 * Use a closure (not a method) so script locals are visible to Gradle Groovy.
 */
def requireMapsApiKey = {
    def key =
        System.getenv('GOOGLE_MAPS_API_KEY')
            ?: envLocal.getProperty('GOOGLE_MAPS_API_KEY')

    if (!(key instanceof String) || !key.trim() || key.trim() == PLACEHOLDER_MAPS_KEY) {
        throw new GradleException(
            "GOOGLE_MAPS_API_KEY is missing or invalid.\n" +
            "  Codemagic: set Secure ENV GOOGLE_MAPS_API_KEY\n" +
            "  Local: create marvira_mobile/.env.local (see .env.example)"
        )
    }
    return key.trim()
}

def mapsApiKey = requireMapsApiKey()

react {
    autolinkLibrariesWithApp()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.marvira"

    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/**/libreanimated.so'
        pickFirst 'lib/**/libhermestooling.so'
        pickFirst 'lib/**/libhermes.so'

        jniLibs {
            pickFirsts += ['**/libc++_shared.so', 'lib/**/libreanimated.so', 'lib/**/libhermestooling.so', 'lib/**/libhermes.so']
        }
    }

    defaultConfig {
        applicationId "com.marvira"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Codemagic sets BUILD_NUMBER / PROJECT_BUILD_NUMBER / NEW_BUILD_NUMBER.
        // Play requires each upload to have a higher versionCode.
        versionCode (
            System.getenv("NEW_BUILD_NUMBER")
                ?: System.getenv("BUILD_NUMBER")
                ?: System.getenv("PROJECT_BUILD_NUMBER")
                ?: "1"
        ).toInteger()
        versionName "1.0"
        multiDexEnabled true
        manifestPlaceholders = [GOOGLE_MAPS_API_KEY: mapsApiKey]
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Codemagic: CI=true + CM_* from android_signing (marvira_android)
            if (System.getenv("CI") && System.getenv("CM_KEYSTORE_PATH")) {
                storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CM_KEY_ALIAS")
                keyPassword System.getenv("CM_KEY_PASSWORD")
            } else if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            def hasCiKeystore = System.getenv("CI") && System.getenv("CM_KEYSTORE_PATH")
            if (hasCiKeystore || keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.sqlite:sqlite-bundled:2.6.2'
    }
}

afterEvaluate {
    tasks.matching { it.name.startsWith("externalNativeBuildClean") }.configureEach { task ->
        task.actions.clear()
        task.doLast {
            delete file("${project.projectDir}/.cxx")
        }
    }
}
